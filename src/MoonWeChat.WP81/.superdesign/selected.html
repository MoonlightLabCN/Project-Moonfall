<body>
  <div class="relative flex h-[853px] w-full max-w-[480px] flex-col overflow-hidden bg-black font-['Segoe_UI','Segoe_UI_Symbol',sans-serif] text-white sm:mx-auto" data-sd-id="1">

          <span data-sd-id="12"><strong class="font-semibold">网关已连接</strong><br><span data-sd-id="13">桌面端在线 · 刚刚同步</span></span>

      <div id="search-panel" class="hidden h-14 items-center border-b border-white/20 px-[19px]" data-sd-id="15">
        <iconify-icon icon="lucide:search" class="mr-3 text-xl text-white/60"></iconify-icon>
        <label for="live-query" class="sr-only" data-sd-id="16">搜索会话和联系人</label>
        <input id="live-query" type="search" autocomplete="off" placeholder="搜索会话和联系人" class="h-12 min-w-0 flex-1 border-0 bg-black p-0 text-[15px] text-white outline-none placeholder:text-white/50" data-sd-id="17">

    <main class="relative min-h-0 flex-1 overflow-hidden" data-sd-id="19">

              <span class="relative shrink-0" data-sd-id="32">
                <img src="https://api.dicebear.com/9.x/initials/svg?seed=HOME&amp;backgroundColor=555555&amp;fontFamily=Arial" alt="家人群" class="h-12 w-12 object-cover grayscale" data-sd-id="33">

              <span class="min-w-0 flex-1 pl-3" data-sd-id="35">

          <div id="contact-list" class="border-t border-white/20" data-sd-id="57">

            <a id="contact-lin-link" href="#contact-lin" data-search="林墨 lin mo" class="contact-row flex h-16 items-center border-b border-white/20 pr-4 active:bg-[#00ABA9]" data-sd-id="61">
              <img src="https://api.dicebear.com/9.x/initials/svg?seed=LM&amp;backgroundColor=777777&amp;fontFamily=Arial" alt="林墨" class="h-12 w-12 object-cover grayscale" data-sd-id="62">

            <a id="contact-mother-link" href="#contact-mother" data-search="妈妈 家人" class="contact-row flex h-16 items-center border-b border-white/20 pr-4 active:bg-[#00ABA9]" data-sd-id="67">

        <section aria-labelledby="discover-heading" class="h-full w-[352px] shrink-0 snap-start overflow-y-auto pb-[72px]" data-sd-id="71">

          <div class="border-t border-white/20" data-sd-id="73">

            <a id="discover-scan-link" href="#scan" class="flex min-h-16 items-center border-b border-white/20 pr-4 active:bg-[#00ABA9]" data-sd-id="76">
              <iconify-icon icon="lucide:scan-line" class="w-12 text-center text-2xl text-[#00ABA9]"></iconify-icon>
              <span class="pl-3 text-[18px]" data-sd-id="77">扫一扫</span>

          <div class="mt-8 border-y border-white/20 p-4" data-sd-id="78">

            <p class="mt-1 text-[13px] text-white/60" data-sd-id="81">12 条动态 · 上次刷新 10:20</p>

        <section aria-labelledby="profile-heading" class="h-full w-[352px] shrink-0 snap-start overflow-y-auto pb-[72px] pr-[19px]" data-sd-id="82">

          <div class="flex min-h-24 items-center border-y border-white/20 py-4" data-sd-id="84">

            <div class="min-w-0 pl-4" data-sd-id="86">
              <p class="truncate text-[18px]" data-sd-id="87">Moon 用户</p>
              <p class="mt-1 text-[13px] text-white/60" data-sd-id="88">微信号：moon_wp81</p>

          <nav aria-label="设置与连接预览" class="mt-8 border-t border-white/20" data-sd-id="89">

            <a id="profile-connect-preview-link" href="#connect" class="flex min-h-16 items-center justify-between border-b border-white/20 active:bg-[#00ABA9]" data-sd-id="94">

            <a id="profile-login-preview-link" href="#login" class="flex min-h-16 items-center justify-between border-b border-white/20 active:bg-[#00ABA9]" data-sd-id="98">
              <span class="flex items-center" data-sd-id="99"><iconify-icon icon="lucide:log-in" class="w-12 text-center text-2xl text-[#00ABA9]"></iconify-icon><span class="pl-3 text-[18px]" data-sd-id="100">登录</span></span>
              <span class="text-[13px] text-[#00ABA9]" data-sd-id="101">已登录</span>

    <nav aria-label="应用命令" class="absolute bottom-0 left-0 z-40 flex h-[72px] w-full items-center justify-center gap-8 border-t border-white/20 bg-black px-[19px]" data-sd-id="102">
      <button id="appbar-refresh-button" type="button" class="flex h-16 min-w-16 flex-col items-center justify-center text-white active:text-[#00ABA9]" aria-label="刷新" data-sd-id="103">
        <iconify-icon id="refresh-icon" icon="lucide:refresh-cw" class="text-2xl"></iconify-icon>
        <span class="mt-1 text-[11px]" data-sd-id="104">刷新</span>
      </button>
      <button id="appbar-search-button" type="button" class="flex h-16 min-w-16 flex-col items-center justify-center text-white active:text-[#00ABA9]" aria-label="搜索" data-sd-id="105">
        <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
        <span class="mt-1 text-[11px]" data-sd-id="106">搜索</span>
      </button>
      <button id="appbar-settings-button" type="button" class="flex h-16 min-w-16 flex-col items-center justify-center text-white active:text-[#00ABA9]" aria-label="转到设置预览" data-sd-id="107">
        <iconify-icon icon="lucide:settings" class="text-2xl"></iconify-icon>
        <span class="mt-1 text-[11px]" data-sd-id="108">设置</span>
      </button>
    </nav>
  </div>

  <script>
    const searchPanel = document.getElementById('search-panel');
    const searchButton = document.getElementById('appbar-search-button');
    const queryInput = document.getElementById('live-query');
    const clearButton = document.getElementById('clear-search-button');
    const hubScroll = document.getElementById('hub-scroll');

    function applyQuery() {
      const query = queryInput.value.trim().toLocaleLowerCase('zh-CN');
      let conversations = 0;
      let contacts = 0;

      document.querySelectorAll('.conversation-row').forEach((row) => {
        const match = row.dataset.search.toLocaleLowerCase('zh-CN').includes(query);
        row.classList.toggle('hidden', !match);
        if (match) conversations++;
      });

      document.querySelectorAll('.contact-row').forEach((row) => {
        const match = row.dataset.search.toLocaleLowerCase('zh-CN').includes(query);
        row.classList.toggle('hidden', !match);
        if (match) contacts++;
      });

      document.getElementById('conversation-empty').classList.toggle('hidden', conversations > 0);
      document.getElementById('contact-empty').classList.toggle('hidden', contacts > 0);
      clearButton.classList.toggle('hidden', query.length === 0);
      clearButton.classList.toggle('flex', query.length > 0);
    }

    searchButton.addEventListener('click', () => {
      searchPanel.classList.toggle('hidden');
      searchPanel.classList.toggle('flex');
      if (!searchPanel.classList.contains('hidden')) queryInput.focus();
    });

    queryInput.addEventListener('input', applyQuery);
    clearButton.addEventListener('click', () => {
      queryInput.value = '';
      applyQuery();
      queryInput.focus();
    });

    document.getElementById('appbar-refresh-button').addEventListener('click', () => {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('animate-spin', 'text-[#00ABA9]');
      setTimeout(() => icon.classList.remove('animate-spin', 'text-[#00ABA9]'), 700);
    });

    document.getElementById('appbar-settings-button').addEventListener('click', () => {
      hubScroll.scrollTo({ left: 1056, behavior: 'smooth' });
    });
  </script>

</body></html>
