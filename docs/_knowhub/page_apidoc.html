:root {
  --wpmax-brand: #16a085;
  --wpmax-brand-ink: #0f7f68;
  --wpmax-text: #1f2937;
  --wpmax-muted: #6b7280;
  --wpmax-bg-soft: #f8fafc;

  --wpmax-code-bg: #0b1220;
  --wpmax-code-border: #1f2937;
  --wpmax-code-fg: #cbd5e1;
}

#html html, #html body {
  color: var(--wpmax-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#html a { color: var(--wpmax-brand); }
#html a:hover { color: var(--wpmax-brand-ink); }

/* 浠ｇ爜鍧椾笌鍐呰仈浠ｇ爜 */
#html pre, #html code, #html kbd, #html samp { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
#html pre {
  background: var(--wpmax-code-bg);
  border: 1px solid var(--wpmax-code-border);
  color: var(--wpmax-code-fg);
  border-radius: 12px;
  padding: 14px 16px;
  overflow: auto;
  position: relative;
}
#html pre code { color: var(--wpmax-code-fg); }

/* 澶嶅埗鎸夐挳锛圝S 娉ㄥ叆锛?*/
#html .wpmax-copy {
  position: absolute; top: 8px; right: 8px;
  background: var(--wpmax-brand);
  color: #fff; border: 0; border-radius: 8px;
  padding: 6px 10px; cursor: pointer; font-size: 12px;
  opacity: .9;
}
#html .wpmax-copy:hover { opacity: 1; }

/* 琛ㄦ牸浼樺寲 */
#html table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 12px 0 16px; }
#html th, #html td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
#html thead th { position: sticky; top: 0; background: #fff; z-index: 1; }

/* Callout */
#html .wpmax-note, #html .wpmax-tip, #html .wpmax-warn {
  border-left: 4px solid; background: var(--wpmax-bg-soft);
  padding: 12px 14px; border-radius: 8px; margin: 12px 0;
}
#html .wpmax-note { border-color: #60a5fa; }
#html .wpmax-tip  { border-color: #34d399; }
#html .wpmax-warn { border-color: #f59e0b; }

/* 褰撳墠閿氱偣楂樹寒 */
:target { scroll-margin-top: 90px; }
:target h2, :target h3, :target h4 { text-decoration: underline; text-decoration-color: var(--wpmax-brand); }

/* 鎮诞鎸夐挳瀹瑰櫒锛圝S 娉ㄥ叆锛?*/
#html #wpmax-fab-wrap {
  position: fixed; right: 20px; bottom: 24px; z-index: 9999;
  display: grid; gap: 10px;
}
#html .wpmax-fab {
  border: none; border-radius: 999px; padding: 12px 14px;
  background: var(--wpmax-brand); color: #fff; cursor: pointer;
  box-shadow: 0 10px 25px rgba(22,160,133,.25);
}
#html .wpmax-fab:hover { background: var(--wpmax-brand-ink); }

/* 椤佃剼锛圚TML 鎴?JS 娉ㄥ叆锛?*/
#html .wpmax-footer {
  margin-top: 36px; padding: 18px 0 26px; border-top: 1px solid #e5e7eb;

}
#html .wpmax-footer a { color: var(--wpmax-brand-ink); text-decoration: none; }
#html .wpmax-footer a:hover { text-decoration: underline; }

<script>(async () => {
          /* ===== WeChatPadProMAX 路 Global JS for Apifox ===== */
(function () {
  const BRAND = "WeChatPadProMAX";
  const VERSION = "v2025-09";
  const BRAND_LINK = "https://wx.knowhub.cloud/";
  const CONTACT = { site: "https://bbs.knowhub.cloud", email: "ops@example.com" };

  const $ = (sel, ctx = document) => ctx.querySelector(sel);
  const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

  // 澶嶅埗鏂囨湰
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("宸插鍒?); }
    catch { toast("澶嶅埗澶辫触"); }

  // Toast
  let toastTimer = null;

    let el = $("#wpmax-toast");
    if (!el) {

      el.id = "wpmax-toast";
      Object.assign(el.style, {
        position: "fixed", left: "50%", bottom: "80px", transform: "translateX(-50%)",
        background: "rgba(17,24,39,.9)", color: "#fff", padding: "8px 12px",
        borderRadius: "8px", fontSize: "12px", zIndex: 10000
      });
      document.body.appendChild(el);

    el.textContent = msg;
    el.style.opacity = "1";
    toastTimer = setTimeout(() => (el.style.opacity = "0"), 1600);
  }

  // 缁欐瘡涓唬鐮佸潡娣诲姞鈥滃鍒垛€濇寜閽?
  function enhanceCodeBlocks() {
    $$("pre code").forEach((code) => {
      const pre = code.parentElement;
      if (pre.querySelector(".wpmax-copy")) return;
      const btn = document.createElement("button");
      btn.className = "wpmax-copy";
      btn.textContent = "澶嶅埗";
      btn.addEventListener("click", () => copyText(code.textContent));

  function enableSmoothAnchors(offset = 80) {
    $$('a[href^="#"]').forEach((a) => {
      a.addEventListener("click", (e) => {
        const id = decodeURIComponent(a.getAttribute("href") || "").slice(1);
        const t = id && document.getElementById(id);
        if (!t) return;
        e.preventDefault();
        const rect = t.getBoundingClientRect();
        const top = window.scrollY + rect.top - offset;
        window.scrollTo({ top, behavior: "smooth" });
        history.replaceState(null, "", "#" + encodeURIComponent(id));
      });
    });
  }

  // 褰撳墠绔犺妭楂樹寒锛堜晶杈圭洰褰曪級
  function highlightActiveSection() {
    const headings = $$("h2[id], h3[id]");
    const map = new Map(headings.map(h => [h.id, h]));
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      const id = visible.target.id;
      // 楂樹寒宸︿晶鐩綍涓搴旂殑閾炬帴
      $$('a[href^="#"]').forEach(a => a.classList.toggle("is-active", decodeURIComponent(a.getAttribute("href").slice(1)) === id));
    }, { rootMargin: "-20% 0px -70% 0px", threshold: [0, 0.25, 0.5, 1] });
    headings.forEach(h => observer.observe(h));
  }

  // 鎮诞鎸夐挳锛氳繑鍥為《閮?& 澶嶅埗鏈〉鐩撮摼
  function injectFAB() {
    if ($("#wpmax-fab-wrap")) return;
    const wrap = document.createElement("div");
    wrap.id = "wpmax-fab-wrap";
    wrap.innerHTML = `
      <button class="wpmax-fab" id="wpmax-top">Top</button>
      <button class="wpmax-fab" id="wpmax-link">澶嶅埗閾炬帴</button>
    `;
    document.body.appendChild(wrap);
    $("#wpmax-top").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    $("#wpmax-link").onclick = () => copyText(location.href);
  }

  // 娉ㄥ叆椤佃剼锛堣嫢浣犳病鍦ㄢ€滆嚜瀹氫箟 HTML鈥濋噷鏀?footer锛岃繖閲岃嚜鍔ㄨˉ锛?
  function ensureFooter() {
    if ($(".wpmax-footer")) return;
    const footer = document.createElement("div");
    footer.className = "wpmax-footer";
    footer.innerHTML = `
      <div>
        <strong>${BRAND}</strong> 路 鏂囨。绔欙紙${VERSION}锛?
        &nbsp;|&nbsp; <a href="${BRAND_LINK}" target="_blank" rel="noopener">瀹樼綉</a>
        &nbsp;|&nbsp; <a href="${CONTACT.site}" target="_blank" rel="noopener">绀惧尯</a>
        &nbsp;|&nbsp; <a href="mailto:${CONTACT.email}">鑱旂郴鎴戜滑</a>
      </div>
      <div>鑷畾涔夋牱寮忎笌鑴氭湰浠呭湪鑷畾涔夊煙鍚嶄笅鎵ц銆?/div>
    `;
    // 灏介噺鎻掑湪鍐呭鍖哄煙鏈熬锛涙壘涓嶅埌鍒欐寕鍒?body 鏈熬
    const containers = ["main", "#root", "#app", "[data-reactroot]"];
    const host = containers.map(sel => $(sel)).find(Boolean) || document.body;
    host.appendChild(footer);
  }

  // 鍒濆涓庤矾鐢卞彉鍖栵紙Apifox 鏂囨。绔欎负 SPA锛?
  function boot() {
    enhanceCodeBlocks();
    enableSmoothAnchors();
    highlightActiveSection();
    injectFAB();
    ensureFooter();
  }

  window.addEventListener("load", () => {
    boot();
    // 鐩戝惉 hash 鎴栬€呭墠绔矾鐢卞彉鍖栵紝閲嶆柊澧炲己锛堥槻姝㈠垏鎹㈤〉闈㈠悗涓㈠け鎸夐挳锛?
    window.addEventListener("hashchange", boot);
    // 鏈変簺涓婚鏄?history pushState锛涚洃鍚?DOM 鍙樺寲鍏滃簳
    const mo = new MutationObserver(() => enhanceCodeBlocks());
    mo.observe(document.body, { childList: true, subtree: true });
  });
})();
